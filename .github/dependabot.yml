# Opens at most a couple of grouped PRs per month instead of one per package.
# Vercel builds a preview deployment for each PR so it can be checked before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
